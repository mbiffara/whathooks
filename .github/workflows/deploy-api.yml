name: Deploy API

# Deploys automatically when api/ or infra/ change on main; note each deploy
# rolls the single stateful task (brief API blip, sessions reconnect).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["api/**", "infra/**", ".github/workflows/deploy-api.yml"]

# Required GitHub secrets:
#   AWS_DEPLOY_ROLE_ARN  — IAM role for OIDC (trust github.com), with CDK deploy perms
#   AWS_REGION           — e.g. us-east-1
#   WH_VPC_ID, WH_DATABASE_URL_SECRET_ARN, WH_REDIS_URL,
#   WH_DB_SG_ID, WH_REDIS_SG_ID, WH_WEB_ORIGIN
#   WH_CERT_ARN, WH_DOMAIN_NAME (optional)

permissions:
  id-token: write # for AWS OIDC
  contents: read

# Never run two CDK deploys at once (CloudFormation rejects concurrent stack
# updates); queue pushes instead.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    # Native arm64: the image targets Graviton, so building on an arm runner
    # removes the QEMU emulation entirely. That emulation was crashing with
    # "uncaught target signal 4 (Illegal instruction)" partway through the
    # pnpm install, hanging the build until the timeout — three times in six
    # attempts on 2026-08-09/10, each costing the full 30 minutes.
    runs-on: ubuntu-24.04-arm
    # Native builds are faster than the old ~12 min cross-compile, so this is
    # a generous ceiling rather than an expected duration.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - run: npm ci

      # No QEMU or buildx setup: the runner is already arm64, so docker
      # builds the image natively.

      - name: CDK deploy
        run: npx cdk deploy --require-approval never
        env:
          WH_VPC_ID: ${{ secrets.WH_VPC_ID }}
          WH_DATABASE_URL_SECRET_ARN: ${{ secrets.WH_DATABASE_URL_SECRET_ARN }}
          WH_REDIS_URL: ${{ secrets.WH_REDIS_URL }}
          WH_DB_SG_ID: ${{ secrets.WH_DB_SG_ID }}
          WH_REDIS_SG_ID: ${{ secrets.WH_REDIS_SG_ID }}
          WH_WEB_ORIGIN: ${{ secrets.WH_WEB_ORIGIN }}
          WH_CERT_ARN: ${{ secrets.WH_CERT_ARN }}
          WH_DOMAIN_NAME: ${{ secrets.WH_DOMAIN_NAME }}
