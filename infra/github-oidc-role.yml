AWSTemplateFormatVersion: "2010-09-09"
Description: >
  One-time bootstrap: GitHub Actions OIDC provider + an IAM role the
  Deploy API workflow assumes to run `cdk deploy`. Least-privilege — the role can
  only assume the CDK bootstrap roles (cdk-*), not the account broadly.
  Deploy once with admin credentials:
    aws cloudformation deploy \
      --template-file infra/github-oidc-role.yml \
      --stack-name whathooks-github-oidc \
      --capabilities CAPABILITY_NAMED_IAM \
      --parameter-overrides GitHubOrg=mbiffara GitHubRepo=whathooks
  Then set the output RoleArn as the GitHub secret AWS_DEPLOY_ROLE_ARN.

Parameters:
  GitHubOrg:
    Type: String
    Default: mbiffara
    Description: GitHub org/user that owns the repo.
  GitHubRepo:
    Type: String
    Default: whathooks
    Description: Repository name.
  SubjectFilter:
    Type: String
    Default: "*"
    Description: >
      Which workflow runs may assume the role. "*" = any ref in the repo.
      Tighten to e.g. "ref:refs/heads/main" (branch) or "environment:production".
  CreateOIDCProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Set to "false" if this account already has the
      token.actions.githubusercontent.com OIDC provider.
  RoleName:
    Type: String
    Default: whathooks-github-deploy
    Description: Name for the deploy role.

Conditions:
  ShouldCreateOIDC: !Equals [!Ref CreateOIDCProvider, "true"]

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOIDC
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        # GitHub's thumbprints (AWS verifies the provider via its own trust store
        # now, but the property is still accepted).
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fc8

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateOIDC
                - !Ref GitHubOIDCProvider
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${GitHubRepo}:${SubjectFilter}
      Policies:
        - PolicyName: cdk-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Assume the CDK bootstrap roles that actually perform the deploy,
              # publish assets (incl. the Docker image to ECR), and do lookups.
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-*
              # The CDK CLI reads the bootstrap version parameter directly.
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:parameter/cdk-bootstrap/*

Outputs:
  RoleArn:
    Description: Set this as the GitHub secret AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
